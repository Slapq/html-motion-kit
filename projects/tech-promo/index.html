<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>HTML Motion Kit — DSH 插件</title>
  <link rel="stylesheet" href="../../engine/base.css">
  <style>
    /* ---------------------------------------------------------------- 主题 */
    :root {
      --ink: #1f2733;
      --ink2: #5b6675;
      --ink3: #5f6b7d;
      --line: #e6ebf2;
      --blue: #1a73e8;
      --blue-2: #8ab4f8;
      --blue-soft: #e8f0fe;
      --blue-ink: #1558c0;
    }
    .stage { background: #fff; }
    .scene { color: var(--ink); font-family: var(--font); }
    .bg-soft {
      background:
        radial-gradient(1200px 800px at 8% 0%, #eef4ff 0%, rgba(238,244,255,0) 58%),
        radial-gradient(1100px 820px at 96% 100%, #e9f1ff 0%, rgba(233,241,255,0) 60%),
        #fff;
    }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 22px;
      box-shadow: 0 18px 48px rgba(16,24,40,.07); }

    /* ---------------------------------------------------------------- 背景节点图（0–24s 不停） */
    .flow { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; }

    /* ---------------------------------------------------------------- 长画布 + 镜头 */
    .strip { position: absolute; left: 0; top: 0; width: 9600px; height: 1080px; z-index: 2;
      will-change: transform; }
    .panel { position: absolute; top: 0; width: 1920px; height: 1080px; }
    .p1 { left: 0; } .p2 { left: 1920px; } .p3 { left: 3840px; }
    .p4 { left: 5760px; } .p5 { left: 7680px; }

    /* ---------------------------------------------------------------- 常驻 HUD */
    .brand { position: absolute; left: 76px; top: 60px; z-index: 6; display: flex; align-items: center; gap: 14px; }
    .brand i { width: 26px; height: 26px; border-radius: 8px;
      background: linear-gradient(140deg, var(--blue), var(--blue-2)); }
    .brand b { font-size: 22px; font-weight: 700; letter-spacing: .04em; }
    .brand span { padding: 6px 14px; border-radius: 999px; background: var(--blue-soft);
      color: var(--blue-ink); font-size: 16px; font-weight: 600; letter-spacing: .1em; }

    .spine { position: absolute; left: 160px; bottom: 62px; width: 1600px; z-index: 6; }
    .sline { position: relative; height: 3px; border-radius: 2px; background: #e3e9f1; }
    .sline .fill { position: absolute; left: 0; top: 0; width: 100%; height: 100%;
      border-radius: 2px; background: var(--blue); transform-origin: left center; }
    .sline .head { position: absolute; left: -5px; top: 50%; width: 11px; height: 11px; margin-top: -5.5px;
      border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 5px rgba(26,115,232,.13); }
    .ticks { position: relative; height: 0; }
    .tick { position: absolute; top: 0; transform: translateX(-1px); }
    .tick i { position: absolute; left: 0; top: -7px; width: 3px; height: 11px; border-radius: 2px; }
    .tick .gd { background: #cfd8e4; }
    .tick .bd { background: var(--blue); opacity: 0; }
    .tick b { position: absolute; left: 0; top: 16px; white-space: nowrap;
      font-size: 16px; font-weight: 500; color: var(--ink3); letter-spacing: .04em; }

    /* ---------------------------------------------------------------- 文字层级 */
    .pill { display: inline-block; padding: 12px 22px; border-radius: 999px;
      background: var(--blue-soft); color: var(--blue-ink); font-size: 19px; font-weight: 600; letter-spacing: .16em; }
    .h1 { margin: 26px 0 0; font-size: 104px; font-weight: 700; letter-spacing: -2px; }
    .lede { margin: 24px 0 0; font-size: 36px; color: var(--ink2); }
    .h2 { margin: 0; font-size: 64px; font-weight: 700; letter-spacing: -1.4px; }
    .sub { margin: 16px 0 0; font-size: 28px; color: var(--ink2); }
    .mid { position: absolute; left: 0; right: 0; text-align: center; }

    /* ---------------------------------------------------------------- 第 1 章：对话 */
    .chat { position: absolute; left: 260px; top: 700px; width: 1400px; overflow: hidden; }
    .chat .bar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 22px;
      background: #f8fafc; border-bottom: 1px solid var(--line); }
    .chat .bar i { width: 10px; height: 10px; border-radius: 50%; background: #dfe5ec; }
    .chat .bar span { margin-left: 6px; font: 15px var(--mono); color: #5f6b7d; }
    .chat pre { margin: 0; padding: 26px 28px; min-height: 128px; font: 24px/1.6 var(--mono);
      color: #26303d; white-space: pre-wrap; background: #fff; }

    /* ---------------------------------------------------------------- 第 2 章：四个工具 */
    .hub { position: absolute; left: 810px; top: 536px; width: 300px; height: 96px; z-index: 3;
      display: flex; align-items: center; justify-content: center; border-radius: 999px;
      background: linear-gradient(140deg, var(--blue), #4f92f0); color: #fff;
      font-size: 27px; font-weight: 600; letter-spacing: .02em;
      box-shadow: 0 18px 40px rgba(26,115,232,.28); }
    .spokes { position: absolute; left: 0; top: 0; z-index: 1; }
    .spokes line { stroke: #b9cdea; stroke-width: 2; stroke-linecap: round; }
    .tool { position: absolute; width: 500px; padding: 26px 30px; z-index: 2; }
    .tool b { display: block; font: 600 27px/1.2 var(--mono); color: var(--blue); }
    .tool span { display: block; margin-top: 10px; font-size: 22px; color: var(--ink2); }
    .t1 { left: 176px; top: 356px; } .t2 { left: 176px; top: 660px; }
    .t3 { left: 1244px; top: 356px; } .t4 { left: 1244px; top: 660px; }

    /* ---------------------------------------------------------------- 第 3 章：四步流程 */
    .steps { position: absolute; left: 160px; top: 396px; display: flex; gap: 55px; z-index: 2; }
    .step { width: 370px; height: 186px; padding: 26px 28px; }
    .step b { font: 700 20px/1 var(--mono); color: var(--blue); letter-spacing: .1em; }
    .step em { display: block; margin-top: 14px; font: 600 26px/1.2 var(--mono); font-style: normal; color: var(--ink); }
    .step span { display: block; margin-top: 12px; font-size: 21px; color: var(--ink2); }
    .rail { position: absolute; left: 160px; top: 582px; width: 1645px; height: 2px;
      background: #e9eef5; border-radius: 2px; z-index: 1; }
    .rail .fill { display: block; width: 100%; height: 100%; border-radius: 2px;
      background: var(--blue-2); transform-origin: left center; }
    .render { position: absolute; left: 160px; top: 714px; width: 1645px; z-index: 2; }
    .render .lbl { display: flex; align-items: baseline; gap: 14px; font-size: 22px; color: var(--ink2); }
    .render .lbl em { font: 600 24px var(--mono); font-style: normal; color: var(--ink); }
    .render .lbl b { margin-left: auto; font: 700 30px var(--mono); color: var(--blue); }
    .render .bar { margin-top: 16px; height: 10px; border-radius: 6px; background: #eaf0f7; overflow: hidden; }
    .render .bar i { display: block; width: 100%; height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, var(--blue), var(--blue-2)); transform-origin: left center; }

    /* ---------------------------------------------------------------- 第 4 章：效果 */
    .code-card { position: absolute; left: 160px; top: 372px; width: 780px; height: 330px;
      padding: 26px 30px; overflow: hidden; }
    .code-card pre { margin: 0; font: 20px/1.7 var(--mono); color: #33404f; white-space: pre; }
    .code-card pre b { color: var(--blue); font-weight: 600; }
    .player { position: absolute; left: 1000px; top: 372px; width: 760px; height: 428px; padding: 14px; }
    .mini { position: relative; width: 100%; height: 100%; border-radius: 14px; overflow: hidden;
      background: linear-gradient(180deg, #f7faff, #eef4ff); }
    .mini .mt { position: absolute; left: 28px; top: 26px; font-size: 30px; font-weight: 700; color: var(--ink); }
    .mini .ms { position: absolute; left: 28px; top: 66px; font-size: 18px; color: var(--ink2); }
    .mini .mdots { position: absolute; left: 0; top: 110px; width: 100%; height: 200px; }
    .mdot { width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--blue); }
    .mini .mbar { position: absolute; left: 28px; right: 28px; bottom: 26px; height: 6px;
      border-radius: 4px; background: #e2eaf6; overflow: hidden; }
    .mini .mbar i { display: block; width: 100%; height: 100%; border-radius: 4px;
      background: var(--blue); transform-origin: left center; }
    .chips { position: absolute; left: 160px; top: 750px; display: flex; gap: 14px; z-index: 2; }
    .chip { padding: 13px 26px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
      color: var(--ink2); font-size: 21px; box-shadow: 0 1px 2px rgba(16,24,40,.04); }

    /* ---------------------------------------------------------------- 第 5 章：安装 */
    .term { position: absolute; left: 260px; top: 420px; width: 1400px; overflow: hidden; }
    .term .bar { height: 46px; display: flex; align-items: center; gap: 10px; padding: 0 22px;
      background: #f8fafc; border-bottom: 1px solid var(--line); }
    .term .bar i { width: 10px; height: 10px; border-radius: 50%; background: #dfe5ec; }
    .term .bar span { margin-left: 6px; font: 15px var(--mono); color: #5f6b7d; }
    .term pre { margin: 0; padding: 30px 32px; min-height: 116px; font: 30px/1.5 var(--mono);
      color: #1b2430; white-space: pre-wrap; background: #fff; }
    .term pre b { color: var(--blue); font-weight: 600; }
    .final { position: absolute; left: 0; right: 0; top: 700px; text-align: center; z-index: 2;
      font-size: 52px; font-weight: 700; letter-spacing: -1px; }
    .foot { position: absolute; left: 0; right: 0; top: 800px; text-align: center; z-index: 2;
      font: 20px var(--mono); color: var(--ink3); letter-spacing: .18em; }
  </style>
</head>
<body>
<script type="module">
  import { createVideo, fx, rng, registerSfx } from '../../engine/index.js';

  // 柔和铃音：正弦基频 + 一点二次谐波，慢衰减。
  registerSfx('bell', (c, o, t, p = {}) => {
    const f = p.freq ?? 880, v = p.volume ?? 1, d = p.dur ?? 2.0;
    for (const [mul, amp, dec] of [[1, 0.05, 1], [2, 0.012, 0.6]]) {
      const osc = c.createOscillator(), gain = c.createGain();
      osc.type = 'sine'; osc.frequency.value = f * mul;
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.linearRampToValueAtTime(amp * v, t + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + d * dec);
      osc.connect(gain).connect(o); osc.start(t); osc.stop(t + d * dec + 0.05);
    }
  });

  const DUR = 24;                   // 全片时长
  const PANEL = 1920;               // 每章画布宽
  const LINE_W = 1600;              // 底部时间轴长度

  // 镜头：五章。每段横移 1.6s + inOutQuad（中点斜率 2 → 峰值约 80px/帧），
  // 到位后仍以约 10px/s 漂移，整片没有一帧是静止的。
  const CAM = { keys: [
    [0.0, 0], [3.0, -30],
    [4.6, -1920, 'inOutQuad'], [8.0, -1950],
    [9.6, -3840, 'inOutQuad'], [13.6, -3870],
    [15.2, -5760, 'inOutQuad'], [18.8, -5790],
    [20.4, -7680, 'inOutQuad'], [24.0, -7710],
  ] };

  // 章节起点，用来点亮底部刻度
  const CHAPTERS = [
    { at: 0.0, label: '01 开场' }, { at: 4.6, label: '02 工具' }, { at: 9.6, label: '03 流程' },
    { at: 15.2, label: '04 效果' }, { at: 20.4, label: '05 安装' },
  ];

  const Q1 = "用 html-motion-kit 做一支介绍它自己的短片，蓝白风格，24 秒，带程序化音效。";
  const Q2 = "dsh plugin add link:html-motion-kit";

  const ticksHTML = CHAPTERS.map((c, i) => {
    const left = (c.at / DUR) * 100;
    return '<span class="tick k' + (i + 1) + '" style="left:' + left.toFixed(2) + '%">' +
      '<i class="gd"></i><i class="bd"></i><b>' + c.label + '</b></span>';
  }).join('');

  const scene = {
    id: 'film', title: 'HTML Motion Kit · DSH 插件', dur: DUR, className: 'bg-soft',
    html: `
      <div class="strip">
        <!-- 01 开场 -->
        <div class="panel p1">
          <div class="mid" style="top:300px">
            <span class="pill p1a">DEEPSEEK HARNESS 插件</span>
            <h1 class="h1 p1b">让 Agent 直接做视频</h1>
            <p class="lede p1c">写场景 · 抽帧检查 · 导出 MP4，全在对话里完成</p>
          </div>
          <div class="card chat p1d">
            <div class="bar"><i></i><i></i><i></i><span>deepseek harness</span></div>
            <pre data-text="${Q1}"></pre>
          </div>
        </div>

        <!-- 02 四个工具 -->
        <div class="panel p2">
          <div class="mid" style="top:180px">
            <h2 class="h2 p2a">一个插件，四个工具</h2>
            <p class="sub p2b">装进 DSH，Agent 就拿到 1 个 skill 和 4 个工具</p>
          </div>
          <svg class="spokes" width="1920" height="1080" viewBox="0 0 1920 1080">
            <line class="sp0" x1="960" y1="584" x2="700" y2="426"/>
            <line class="sp1" x1="960" y1="584" x2="700" y2="730"/>
            <line class="sp2" x1="960" y1="584" x2="1220" y2="426"/>
            <line class="sp3" x1="960" y1="584" x2="1220" y2="730"/>
          </svg>
          <div class="hub p2c">html-motion-kit</div>
          <div class="card tool t1 p2t"><b>motion_new</b><span>新建项目，生成三幕场景模板</span></div>
          <div class="card tool t2 p2t"><b>motion_still</b><span>在任意时刻抽一帧，检查构图</span></div>
          <div class="card tool t3 p2t"><b>motion_render</b><span>逐帧导出 MP4，可并行加速</span></div>
          <div class="card tool t4 p2t"><b>motion_info</b><span>读项目列表与完整 API 文档</span></div>
        </div>

        <!-- 03 四步流程 -->
        <div class="panel p3">
          <div class="mid" style="top:180px">
            <h2 class="h2 p3a">四步，从一句话到 MP4</h2>
            <p class="sub p3b">中间产物全部可检查、可回溯</p>
          </div>
          <div class="rail p3f"><i class="fill"></i></div>
          <div class="steps">
            <div class="card step p3s"><b>01</b><em>motion_new</em><span>新建项目，拿到三幕模板</span></div>
            <div class="card step p3s"><b>02</b><em>build(tl, el)</em><span>写场景，动画全挂在 tl 上</span></div>
            <div class="card step p3s"><b>03</b><em>motion_still</em><span>抽帧看画面，不行就改</span></div>
            <div class="card step p3s"><b>04</b><em>motion_render</em><span>导出 MP4，音画一次成型</span></div>
          </div>
          <div class="render p3r">
            <div class="lbl"><em>motion_render</em><span>· 1920×1080 · 30fps · 4 workers</span><b class="frames">0</b></div>
            <div class="bar"><i></i></div>
          </div>
        </div>

        <!-- 04 效果 -->
        <div class="panel p4">
          <div class="mid" style="top:180px">
            <h2 class="h2 p4a">画面是时间的函数</h2>
            <p class="sub p4b">拖到哪里，导出就是哪一帧</p>
          </div>
          <div class="card code-card p4c"><pre>scenes: [{
  id: 'film', dur: <b>24</b>,
  build(tl, el) {
    tl.from(el, { opacity: 0, y: 28 },
      { dur: 0.95, ease: '<b>outCubic</b>' });
    tl.sfx('<b>bell</b>', 0.55, { freq: 659.25 });
  },
}]</pre></div>
          <div class="card player p4d">
            <div class="mini">
              <div class="mt">蓝白 · 简洁 · 连续</div>
              <div class="ms">同一套 HTML，预览与导出逐帧一致</div>
              <div class="mdots"></div>
              <div class="mbar"><i></i></div>
            </div>
          </div>
          <div class="chips p4e">
            <span class="chip">时间轴</span><span class="chip">节点图</span>
            <span class="chip">可追溯</span><span class="chip">程序化音效</span><span class="chip">并行导出</span>
          </div>
        </div>

        <!-- 05 安装 -->
        <div class="panel p5">
          <div class="mid" style="top:220px">
            <h2 class="h2 p5a">装进 DSH</h2>
            <p class="sub p5b">一条命令，Agent 就有了拍片能力</p>
          </div>
          <div class="card term p5c">
            <div class="bar"><i></i><i></i><i></i><span>terminal</span></div>
            <pre data-text="${Q2}"></pre>
          </div>
          <div class="final p5d">从此，视频也是一种输出格式。</div>
          <div class="foot p5e">HTML MOTION KIT · MIT</div>
        </div>
      </div>

      <div class="brand bf"><i></i><b>HTML MOTION KIT</b><span>DSH PLUGIN</span></div>
      <div class="spine sf">
        <div class="sline"><i class="fill"></i><i class="head"></i></div>
        <div class="ticks">${ticksHTML}</div>
      </div>`,
    build(tl, el) {
      const q = (s) => el.querySelector(s);
      const qa = (s) => Array.from(el.querySelectorAll(s));

      // ---------- 1. 背景节点图：46 个节点持续漂移，距离近就连线。全程不停，也不闪烁。
      const cv = document.createElement('canvas');
      cv.width = 1920; cv.height = 1080; cv.className = 'flow';
      el.appendChild(cv);
      const ctx = cv.getContext('2d');
      const rnd = rng(11);
      const NODES = Array.from({ length: 46 }, () => ({
        bx: 60 + rnd() * 1800, by: 50 + rnd() * 880,
        ax: 40 + rnd() * 74, ay: 26 + rnd() * 58,
        wx: 0.09 + rnd() * 0.2, wy: 0.09 + rnd() * 0.2,
        px: rnd() * 6.283, py: rnd() * 6.283,
        r: 1.8 + rnd() * 1.6,
      }));
      const LINK = 196;
      tl.add((lt) => {
        ctx.clearRect(0, 0, 1920, 1080);
        // 竖向基准线：与镜头同向、更慢，形成视差
        ctx.strokeStyle = 'rgba(26,115,232,.05)'; ctx.lineWidth = 1;
        const off = -((lt * 9) % 160);
        for (let x = off; x < 1920; x += 160) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke();
        }
        const P = NODES.map((n) => [
          n.bx + Math.sin(lt * n.wx + n.px) * n.ax,
          n.by + Math.cos(lt * n.wy + n.py) * n.ay,
        ]);
        ctx.lineWidth = 1;
        for (let i = 0; i < P.length; i++) {
          for (let j = i + 1; j < P.length; j++) {
            const dx = P[i][0] - P[j][0], dy = P[i][1] - P[j][1];
            const d = Math.hypot(dx, dy);
            if (d > LINK) continue;
            ctx.strokeStyle = 'rgba(26,115,232,' + (0.30 * (1 - d / LINK)).toFixed(3) + ')';
            ctx.beginPath(); ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[j][0], P[j][1]); ctx.stroke();
          }
        }
        ctx.fillStyle = 'rgba(26,115,232,.42)';
        for (const [x, y] of P) { ctx.beginPath(); ctx.arc(x, y, 2.4, 0, 6.2832); ctx.fill(); }
      }, { label: 'flow' });

      // ---------- 2. 镜头：一条关键帧，从头推到尾
      tl.graph({ root: el, stage: el }).add([
        { kind: 'node', id: 'camera', type: 'layer', target: '.strip', params: { x: CAM } },
      ]);

      // ---------- 3. 常驻 HUD
      tl.from(q('.bf'), { opacity: 0, y: -12 }, { at: 0.10, dur: 0.6, ease: 'outCubic' });
      tl.from(q('.sf'), { opacity: 0, y: 14 }, { at: 0.25, dur: 0.7, ease: 'outCubic' });
      tl.from(q('.sline .fill'), { scaleX: 0 }, { at: 0, dur: DUR, ease: 'linear' });
      tl.fromTo(q('.sline .head'), { x: 0 }, { x: LINE_W }, { at: 0, dur: DUR, ease: 'linear' });
      CHAPTERS.forEach((c, i) => {
        tl.fromTo(q('.tick.k' + (i + 1) + ' .bd'), { opacity: 0, scale: 0.4 },
          { opacity: 1, scale: 1 }, { at: c.at, dur: 0.45, ease: 'outCubic' });
      });

      // ---------- 4. 第 1 章
      tl.from(q('.p1a'), { opacity: 0, y: 14 }, { at: 0.25, dur: 0.70, ease: 'outCubic' });
      tl.from(q('.p1b'), { opacity: 0, y: 30 }, { at: 0.38, dur: 0.95, ease: 'outCubic' });
      tl.from(q('.p1c'), { opacity: 0, y: 22 }, { at: 0.58, dur: 0.90, ease: 'outCubic' });
      tl.from(q('.p1d'), { opacity: 0, y: 26 }, { at: 0.78, dur: 0.85, ease: 'outCubic' });
      tl.op('typewriter', q('.p1d pre'), { at: 1.15, cps: 34, sfx: 'type', sfxEvery: 6 });

      // ---------- 5. 第 2 章（内容在镜头到位前 0.5s 就开始入场，画面上不留空窗）
      tl.from(q('.p2a'), { opacity: 0, y: 26 }, { at: 4.10, dur: 0.85, ease: 'outCubic' });
      tl.from(q('.p2b'), { opacity: 0, y: 20 }, { at: 4.23, dur: 0.85, ease: 'outCubic' });
      tl.from(q('.p2c'), { opacity: 0, scale: 0.94 }, { at: 4.37, dur: 0.8, ease: 'outCubic' });
      fx.staggerIn(tl, qa('.p2t'), { at: 4.55, stagger: 0.13, dur: 0.8, from: { opacity: 0, y: 24 }, sfx: null });
      // 连线：从中心向四个工具生长
      const spokes = qa('.spokes line').map((L) => ({ el: L, len: L.getTotalLength() }));
      spokes.forEach((s) => { s.el.style.strokeDasharray = s.len; });
      tl.add((lt) => {
        spokes.forEach((s, i) => {
          const p = Math.max(0, Math.min(1, (lt - (4.43 + i * 0.12)) / 0.75));
          s.el.style.strokeDashoffset = String(s.len * (1 - p) ** 3);
        });
      }, { label: 'spokes' });

      // ---------- 6. 第 3 章
      tl.from(q('.p3a'), { opacity: 0, y: 26 }, { at: 9.10, dur: 0.85, ease: 'outCubic' });
      tl.from(q('.p3b'), { opacity: 0, y: 20 }, { at: 9.23, dur: 0.85, ease: 'outCubic' });
      fx.staggerIn(tl, qa('.p3s'), { at: 9.43, stagger: 0.11, dur: 0.8, from: { opacity: 0, y: 26 }, sfx: null });
      tl.from(q('.p3f .fill'), { scaleX: 0 }, { at: 9.45, dur: 1.7, ease: 'outCubic' });
      tl.from(q('.p3r'), { opacity: 0, y: 24 }, { at: 10.35, dur: 0.8, ease: 'outCubic' });
      tl.fromTo(q('.p3r .bar i'), { scaleX: 0 }, { scaleX: 1 }, { at: 10.75, dur: 2.4, ease: 'inOutCubic' });
      tl.op('counter', q('.frames'), { at: 10.75, from: 0, to: 720, dur: 2.4, ease: 'inOutCubic', sfx: null });

      // ---------- 7. 第 4 章
      tl.from(q('.p4a'), { opacity: 0, y: 26 }, { at: 14.70, dur: 0.85, ease: 'outCubic' });
      tl.from(q('.p4b'), { opacity: 0, y: 20 }, { at: 14.83, dur: 0.85, ease: 'outCubic' });
      tl.from(q('.p4c'), { opacity: 0, y: 28 }, { at: 15.05, dur: 0.9, ease: 'outCubic' });
      tl.from(q('.p4d'), { opacity: 0, y: 28 }, { at: 15.19, dur: 0.9, ease: 'outCubic' });
      fx.staggerIn(tl, qa('.p4e .chip'), { at: 15.70, stagger: 0.09, dur: 0.7, from: { opacity: 0, y: 18 }, sfx: null });
      // 播放器卡片里的小场景：自己也在动
      tl.from(q('.mini .mt'), { opacity: 0, y: 14 }, { at: 15.50, dur: 0.7, ease: 'outCubic' });
      tl.from(q('.mini .ms'), { opacity: 0, y: 12 }, { at: 15.64, dur: 0.7, ease: 'outCubic' });
      tl.from(q('.mini .mbar i'), { scaleX: 0 }, { at: 15.60, dur: 2.2, ease: 'inOutCubic' });

      // ---------- 8. 第 5 章
      tl.from(q('.p5a'), { opacity: 0, y: 26 }, { at: 19.90, dur: 0.85, ease: 'outCubic' });
      tl.from(q('.p5b'), { opacity: 0, y: 20 }, { at: 20.03, dur: 0.85, ease: 'outCubic' });
      tl.from(q('.p5c'), { opacity: 0, y: 28 }, { at: 20.27, dur: 0.9, ease: 'outCubic' });
      tl.op('typewriter', q('.p5c pre'), { at: 20.75, cps: 30, sfx: 'type', sfxEvery: 5 });
      tl.from(q('.p5d'), { opacity: 0, y: 24 }, { at: 22.20, dur: 0.9, ease: 'outCubic' });
      tl.from(q('.p5e'), { opacity: 0 }, { at: 22.60, dur: 0.9, ease: 'outCubic' });

      // ---------- 9. 第 4 章里的复制器（小场景点阵）
      tl.graph({ root: el, stage: el }).add([
        { kind: 'node', id: 'mini', type: 'duplicator', parent: '.mdots', html: '<i class="mdot"></i>', count: 96,
          distribution: { type: 'grid', cols: 16, spacing: [42, 34], center: [366, 96] },
          falloff: { type: 'linear', angle: 18, width: 700,
            offset: { keys: [[14.8, -900], [19.4, 1400, 'inOutQuad']] } },
          params: {
            scale: { value: 1.5, fx: [{ type: 'falloff', rest: .3 }] },
            opacity: { value: 1, fx: [{ type: 'falloff', rest: .12 }] } } },
      ]);

      // ---------- 10. 声音：铺底 + 旋律，跟着镜头走
      tl.sfx('pad', 0, { dur: DUR + 0.3, volume: 1.1, root: 110 });
      tl.sfx('pad', 0, { dur: DUR + 0.3, volume: 0.7, root: 165 });
      const MOTIF = [
        [0.4, 659.25], [1.5, 880.00], [2.6, 783.99],
        [4.7, 587.33], [5.8, 880.00], [6.9, 987.77], [8.0, 659.25],
        [9.7, 783.99], [10.8, 880.00], [11.9, 1046.50], [13.0, 783.99],
        [15.3, 880.00], [16.4, 987.77], [17.5, 659.25], [18.6, 783.99],
        [20.5, 880.00], [21.6, 1046.50], [22.7, 1318.51],
      ];
      for (const [t, f] of MOTIF) tl.sfx('bell', t, { freq: f, volume: 1 });
      tl.sfx('air', 0.05, { volume: 0.45, dur: 1.4 });
      for (const t of [3.05, 8.05, 13.65, 18.85]) tl.sfx('air', t, { volume: 0.55, dur: 1.4 });
      for (const t of [4.65, 9.65, 15.25, 20.45]) tl.sfx('thump', t, { volume: 0.45 });
      tl.sfx('soft', 4.60, { volume: 1.4 });
      tl.sfx('chime', 22.70, { volume: 1.2 });

      // ---------- 11. 收尾
      tl.to(el, { opacity: 0 }, { at: 23.30, dur: 0.70, ease: 'outQuad' });
    },
  };

  await createVideo({
    width: 1920, height: 1080, fps: 30,
    theme: { accent: '#1a73e8', accent2: '#8ab4f8' },
    scenes: [scene],
  });
</script>
</body>
</html>
