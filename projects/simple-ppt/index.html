<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>简单的幻灯片</title>
  <link rel="stylesheet" href="../../engine/base.css">
  <style>
    /* 一份全局 CSS，类名按页命名空间，别跨页重名（docs/lessons.md §2.5） */
    .wrap { position: absolute; left: 160px; right: 160px; top: 0; bottom: 150px; z-index: 2;
            display: flex; flex-direction: column; justify-content: center; }
    .wrap.mid { align-items: center; text-align: center; }

    /* 封面 */
    .h1 { font-size: 92px; max-width: 100%; }
    .lede { max-width: 1100px; }

    /* 目录 */
    .list { margin-top: 56px; }
    .item { display: flex; align-items: center; gap: 32px; padding: 26px 0; border-top: 1px solid var(--line); }
    .item:last-child { border-bottom: 1px solid var(--line); }
    .item b { flex: none; width: 66px; font-size: 22px; font-weight: 700; color: var(--accent); letter-spacing: .08em; }
    .item h3 { margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -.6px; }
    .item p { margin: 0 0 0 auto; font-size: 26px; color: var(--muted); text-align: right; }

    /* 流程 */
    .flow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px; margin-top: 52px; }
    .step { padding: 34px 34px 38px; border: 1px solid var(--line); border-radius: 20px; background: #fff;
            box-shadow: 0 18px 48px rgba(16,24,40,.06); }
    .step i { display: inline-flex; align-items: center; justify-content: center; width: 46px; height: 46px; border-radius: 50%;
              background: var(--accent-soft); color: color-mix(in srgb, var(--accent) 80%, var(--fg)); font: 600 21px/1 var(--font); font-style: normal; }
    .step h3 { margin: 20px 0 0; font-size: 34px; font-weight: 700; }
    .step p { margin: 10px 0 0; font-size: 24px; line-height: 1.5; color: var(--muted); }
    .barrow { display: flex; align-items: center; gap: 20px; margin-top: 54px; }
    .bar { position: relative; flex: 1; height: 12px; border-radius: 6px; overflow: hidden; background: var(--line); }
    .bar i { position: absolute; inset: 0; border-radius: 6px; background: var(--accent); transform-origin: left center; }
    .pct { flex: none; width: 84px; text-align: right; font: 700 28px/1.2 var(--font); color: var(--accent); }
    .foot { display: flex; justify-content: space-between; margin-top: 16px; font-size: 21px; color: var(--faint); letter-spacing: .04em; }

    /* 结尾 */
    .go { margin-top: 40px; font-size: 24px; color: var(--faint); letter-spacing: .1em; }

    /* 页码（全片常驻） */
    .pager { position: absolute; left: 0; right: 0; bottom: 74px; display: flex; justify-content: center; gap: 12px; }
    .pager i { width: 28px; height: 4px; border-radius: 2px; background: var(--line); transition: background .3s; }
    .pager i.on { background: var(--accent); }
  </style>
</head>
<body>
<script type="module">
  import { createVideo, fx } from '../../engine/index.js';

  // 翻页模式：一页 = 一个场景，场景之间用转场衔接。
  // 常驻层（背景网格 + 页码）不属于任何一页，所以翻页时它们继续动 —— 这是它和真 PPT 唯一的区别。
  const T = 0.6;            // 转场时长，下面 transition.dur 必须一致
  let firstFrame = true;

  await createVideo({
    width: 1920, height: 1080, fps: 30,
    look: 'light',
    theme: { accent: '#1a73e8' },
    background: 'network',
    scenes: [
      {
        id: 'cover', title: '封面', dur: 4.5,
        html: `
          <div class="wrap mid">
            <span class="kicker">SLIDES</span>
            <h1 class="h1">简单的幻灯片</h1>
            <p class="lede">四页，三段式入场：一行标题、一条清单、一次翻页</p>
          </div>`,
        build(tl, el, ctx) {
          addPager(tl, el, ctx);
          tl.sfx('soft', 0.05, { freq: 660 });
          // 第一个字块必须在 0.25s 内可见：翻页模式没有镜头，开头空太久就是一段黑场。
          fx.textIn(tl, el.querySelector('.kicker'), { at: 0.05, preset: 'fade', dur: 0.5 });
          fx.textIn(tl, el.querySelector('.h1'), { at: 0.30, preset: 'line' });
          fx.textIn(tl, el.querySelector('.lede'), { at: 0.60, preset: 'fade', sfx: 'chime' });
          tl.caption('翻页模式：一页 = 一个场景', 1.5, 2.4);
          leave(tl, el, ctx.dur);
        },
      },
      {
        id: 'agenda', title: '目录', dur: 6, transition: { type: 'fade', dur: T },
        html: `
          <div class="wrap">
            <h2 class="h2">三件事</h2>
            <p class="sub">每条一行，不写成段落</p>
            <div class="list">
              <div class="item"><b>01</b><h3>先写分镜</h3><p>每页一句话，先说清目的</p></div>
              <div class="item"><b>02</b><h3>再排版面</h3><p>白底、一个主色、克制字号</p></div>
              <div class="item"><b>03</b><h3>最后入场</h3><p>三个入场预设，不要更多</p></div>
            </div>
          </div>`,
        build(tl, el, ctx) {
          addPager(tl, el, ctx);
          fx.textIn(tl, el.querySelector('.h2'), { at: 0.1, preset: 'line' });
          fx.textIn(tl, el.querySelector('.sub'), { at: 0.4, preset: 'fade' });
          fx.staggerIn(tl, el.querySelectorAll('.item'), {
            at: 0.7, stagger: 0.25, dur: 0.8, from: { y: 34, opacity: 0 }, sfx: 'blip',
          });
          tl.caption('内容是静态的，只有入场在动', 2.2, 2.6);
          leave(tl, el, ctx.dur);
        },
      },
      {
        id: 'flow', title: '流程', dur: 7.5, transition: { type: 'fade', dur: T },
        html: `
          <div class="wrap">
            <h2 class="h2">三步走完一遍</h2>
            <div class="flow">
              <div class="step"><i>1</i><h3>创建项目</h3><p>一条命令，拿到三幕模板</p></div>
              <div class="step"><i>2</i><h3>写场景</h3><p>HTML 排版，tl 排时间</p></div>
              <div class="step"><i>3</i><h3>导出成片</h3><p>逐帧渲染，预览即成品</p></div>
            </div>
            <div class="barrow"><div class="bar"><i></i></div><span class="pct">0%</span></div>
            <div class="foot"><span>建项目</span><span>写场景</span><span>导成片</span></div>
          </div>`,
        build(tl, el, ctx) {
          addPager(tl, el, ctx);
          fx.textIn(tl, el.querySelector('.h2'), { at: 0.1, preset: 'line' });
          fx.staggerIn(tl, el.querySelectorAll('.step'), {
            at: 0.45, stagger: 0.18, dur: 0.75, from: { y: 40, opacity: 0 }, sfx: 'pop',
          });
          tl.to(el.querySelector('.bar i'), { scaleX: 1 }, { at: 1.25, dur: 1.7, ease: 'inOutQuad' });
          fx.counter(tl, el.querySelector('.pct'), {
            at: 1.25, dur: 1.7, from: 0, to: 100, ease: 'inOutQuad', format: (n) => Math.round(n) + '%',
          });
          fx.textIn(tl, el.querySelector('.foot'), { at: 1.5, preset: 'fade' });
          // 错落退场：卡片先走，标题留到最后和下一页交叉，紧贴转场窗口——不留空档。
          // flow 在本地 7.5 结束（全局 16.8），leave() 默认在 [dur-T, dur] 淡出 .wrap，
          // 正好落在与下一页的转场窗口里；卡片/进度条/页脚提前一点错落退场，交给 .wrap 收尾。
          tl.to(el.querySelectorAll('.step'), { opacity: 0, y: -22 }, { at: 5.6, dur: 0.5, stagger: 0.2, ease: 'inOutQuad' });
          tl.to(el.querySelector('.barrow'), { opacity: 0 }, { at: 5.65, dur: 0.5, ease: 'inOutQuad' });
          tl.to(el.querySelector('.foot'), { opacity: 0 }, { at: 5.65, dur: 0.5, ease: 'inOutQuad' });
          leave(tl, el, ctx.dur);
        },
      },
      {
        id: 'outro', title: '结尾', dur: 5, transition: { type: 'fade', dur: T },
        html: `
          <div class="wrap mid">
            <h2 class="h2">就这四页</h2>
            <p class="lede">把页面写死、把时间排好，剩下的交给导出</p>
            <p class="go">npm run render -- projects/simple-ppt</p>
          </div>`,
        build(tl, el, ctx) {
          tl.sfx('chime', 0.3);
          // 最后一页从 0 帧就入场：上一页在转场里淡出，这一页同时在升起来 —— 中间不留空白。
          fx.textIn(tl, el.querySelector('.h2'), { at: 0, preset: 'line', dur: 0.6 });
          fx.textIn(tl, el.querySelector('.lede'), { at: 0.35, preset: 'line' });
          fx.textIn(tl, el.querySelector('.go'), { at: 0.75, preset: 'fade' });
        },
      },
    ],
  });

  // 这一页的内容退场：在转场窗口内部淡出，和下一页的入场交叉，避免"停住等翻页"的空档。
  // 卡片已经错落退场的页面，把整体淡出往后推，别让标题提前跟着一起走。
  // 注意 at 必须给出绝对锚点：裸数字会被当成"相对上一项"，整页会提前消失。
  function leave(tl, el, dur, delay = 0) {
    tl.to(el.querySelector('.wrap'), { opacity: 0, y: -16 },
      { at: dur - T - delay, dur: T, ease: 'inOutQuad' });
  }

  // 页码：每页注册时写下自己的序号，每帧只负责把"当前页"点亮。
  // 必须挂进 .stage（挂在 body 上会被 .stage 的黑底盖住，导出缩放时也不跟着 transform 走）。
  function addPager(tl, el, ctx) {
    const stage = el.parentElement;
    let pager = stage.querySelector(':scope > .pager');
    if (!pager) {
      pager = document.createElement('div');
      pager.className = 'pager';
      stage.appendChild(pager);
    }
    const dot = document.createElement('i');
    pager.appendChild(dot);
    const isFirst = firstFrame;
    firstFrame = false;
    tl.add((lt, t) => {
      const cur = t >= ctx.start && t < ctx.end;
      if (cur !== dot.classList.contains('on')) dot.classList.toggle('on', cur);
    }, { at: 0, label: 'pager' });
    if (isFirst) tl.from(pager, { opacity: 0 }, { at: 0.2, dur: 0.8, ease: 'outQuad' });
  }
</script>
</body>
</html>
