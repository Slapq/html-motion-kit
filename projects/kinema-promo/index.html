<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>Kinema · 字符里的几何</title>
  <link rel="stylesheet" href="../../engine/base.css">
  <style>
    /* 一镜到底：镜头在一个字符化的几何世界里穿行，几何体本身在变形。
       空心立方体 → 穿过它的窗口进入隧道 → 隧道打开成柱阵 → 柱阵融成螺旋曲面，钻进去 →
       钻出来是一个圆环 → 圆环收成球 → 字标。文字要么贴在空间里迎面飞过，要么把字符挖出一个洞浮在最上层。 */
    :root { --g: #12C76A; --g2: #22E04F; --b: #2F6BE0; --w: #EDEDED; --dim: #8b919b;
      --mono: "Cascadia Code", "Cascadia Mono", Consolas, "Microsoft YaHei", monospace; }
    .stage, .film { background: #000; }
    .kn-cv { position: absolute; left: 0; top: 0; }
    .kn-t { position: absolute; z-index: 3; margin: 0; font-family: var(--mono); white-space: pre; }
    .cg { color: var(--g); } .cb { color: var(--b); } .cw { color: var(--w); }

    .kn-sys { left: 120px; top: 356px; padding: 4px 12px; font-size: 22px; font-weight: 700; background: var(--g); color: #000; }
    .kn-hl { left: 120px; top: 410px; font-size: 104px; font-weight: 700; line-height: normal; }
    .kn-read { left: 120px; top: 968px; font-size: 26px; color: var(--g2); }
    .kn-cap { left: 0; right: 0; top: 880px; text-align: center; font-family: "Microsoft YaHei", sans-serif; font-weight: 700; font-size: 40px; color: var(--w); }

    .kn-l { font-weight: 700; line-height: normal; }
    .kn-l1 { left: 140px; top: 270px; font-size: 120px; color: var(--g); }
    .kn-l2 { left: 240px; top: 440px; font-size: 120px; color: var(--b); filter: brightness(1.25); }
    .kn-l3 { left: 340px; top: 610px; font-size: 104px; color: var(--w); }

    .kn-mark { left: 0; right: 0; top: 330px; text-align: center; font-size: 190px; font-weight: 700; line-height: normal; color: #F4F4F4; letter-spacing: 6px; }
    .kn-sub { left: 0; right: 0; top: 622px; text-align: center; font-family: "Microsoft YaHei", sans-serif; font-weight: 700; font-size: 40px; color: var(--w); }
    .kn-sub em { font-style: normal; color: var(--g2); }
    .kn-repo { left: 0; right: 0; top: 700px; text-align: center; font-size: 28px; color: var(--b); filter: brightness(1.35); }
    .kn-note { left: 0; right: 0; top: 752px; text-align: center; font-size: 22px; color: var(--dim); }

    .kn-c { font-size: 20px; color: var(--dim); }
    .kn-tl { left: 48px; top: 36px; } .kn-tr { right: 48px; top: 36px; }
    .kn-bl { left: 48px; top: 1018px; } .kn-br { right: 48px; top: 1018px; }
  </style>
</head>
<body>
<script type="module">
  import { createVideo, rng, resolveEase, AsciiSpace } from '../../engine/index.js';

  const DUR = 28, W = 1920, H = 1080;
  const C = { g: '#12C76A', g2: '#22E04F', b: '#2F6BE0', bd: '#1b3f8a', w: '#EDEDED' };
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ramp = (t, a, b) => clamp((t - a) / (b - a));
  const io = resolveEase('inOutCubic'), sm = (x) => x * x * (3 - 2 * x);
  const hash = (i, s = 0) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
  const GLYPH = '<>/\\|=+*#%@01{}[]:;';
  const MONO = '"Cascadia Code", "Cascadia Mono", Consolas, "Microsoft YaHei", monospace';

  // 文字改写：keys = [[t, 文本 | (t)=>文本]]，每次改写在 dur 秒内由乱码过渡（确定性，可拖动）
  function morph(tl, el, keys, { dur = 0.5, seed = 1 } = {}) {
    const val = (k, t) => (typeof k[1] === 'function' ? k[1](t) : k[1]);
    tl.add((lt) => {
      let k = -1;
      for (let i = 0; i < keys.length; i++) if (keys[i][0] <= lt) k = i;
      let s;
      if (k < 0) s = val(keys[0], lt);
      else {
        const next = val(keys[k], lt), p = (lt - keys[k][0]) / dur;
        if (p >= 1 || k === 0) s = next;
        else {
          const prev = [...val(keys[k - 1], keys[k][0])], nx = [...next];
          const L = Math.round(prev.length + (nx.length - prev.length) * clamp(p * 1.5));
          const r = rng(seed * 97 + Math.floor(lt * 30));
          s = Array.from({ length: L }, (_, i) => {
            const u = i / Math.max(1, L);
            if (u < p * 1.3 - 0.3) return nx[i] ?? '';
            if (u < p * 1.3) return (nx[i] === ' ' ? ' ' : GLYPH[Math.floor(r() * GLYPH.length)]);
            return prev[i] ?? GLYPH[Math.floor(r() * GLYPH.length)];
          }).join('');
        }
      }
      if (el.textContent !== s) el.textContent = s;
    }, { at: 0, label: 'morph' });
  }
  const type = (s, dt, cps) => [...s].slice(0, clamp(Math.floor(dt * cps), 0, 999)).join('');

  // 标题配色：括号/运算符蓝、词绿、少数关键词白
  const WHITE = new Set(['MAKER', 'CODER', 'AGENT', 't', 'nodes', '30fps', 'KINEMA']);
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
  function runs(s) {
    const out = [];
    for (const tok of s.split(/([A-Za-z0-9一-鿿]+)/)) {
      if (!tok) continue;
      if (/^[A-Za-z0-9一-鿿]+$/.test(tok)) out.push([tok, WHITE.has(tok) ? 'w' : 'g']);
      else for (const ch of tok) out.push([ch, '()[]{}<>=,'.includes(ch) ? 'b' : 'g']);
    }
    const m = [];
    for (const r of out) { if (m.length && m[m.length - 1][1] === r[1]) m[m.length - 1][0] += r[0]; else m.push([...r]); }
    return m;
  }
  const runsHTML = (s) => runs(s).map(([t, c]) => `<span class="c${c}">${esc(t)}</span>`).join('');
  const COL = { g: C.g, b: C.b, w: C.w };

  // ---- 几何世界（世界坐标沿 +z 排开，镜头一路穿过去）----
  // 0 空心立方体 @原点 → 1 从立方体背面长出的格栅隧道 z 1.6..22 → 2 柱阵（节点）z 13..46
  // → 柱阵融成螺旋曲面(gyroid) → 4 远处的圆环 @z56 → 圆环收成球。uW = 各几何的"生长量"，0 时被侵蚀消失。
  const MAP = `
mat2 R(float a){ float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float box(vec3 p, vec3 b){ vec3 q = abs(p) - b; return length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.); }
float edge(vec3 p, float b, float e){ p = abs(p) - b; vec3 q = abs(p + e) - e;
  return min(min(length(max(vec3(p.x, q.y, q.z), 0.)) + min(max(p.x, max(q.y, q.z)), 0.),
                 length(max(vec3(q.x, p.y, q.z), 0.)) + min(max(q.x, max(p.y, q.z)), 0.)),
                 length(max(vec3(q.x, q.y, p.z), 0.)) + min(max(q.x, max(q.y, p.z)), 0.)); }
float h21(vec2 c){ return fract(sin(dot(c, vec2(127.1, 311.7))) * 43758.5453); }
float pillars(vec3 p){
  vec2 c = floor(p.xz / .9), l = mod(p.xz, .9) - .45;
  float n = .5 + .5 * sin(c.x * .8 + c.y * .55 - uTime * 2.4 + h21(c) * 6.28);
  float f = exp(-.08 * dot(p.xz - uFall, p.xz - uFall));
  float h = (.15 + 1.5 * n * n + 1.6 * f) * uW[2];
  float d = box(vec3(l.x, p.y + 1.9 - h * .5, l.y), vec3(.3, h * .5 + .01, .3)) - .02;
  return max(d * .6, max(abs(p.x) - 7., max(13. - p.z, p.z - 46.)));
}
float gyroid(vec3 p){
  vec3 q = p * 1.15; q.xy *= R(p.z * .05);
  float g = abs(dot(sin(q), cos(q.yzx))) / 1.15 * .55 - .07;
  return max(g, box(p - vec3(0., .4, 30.), vec3(6.5, 2.8, 16.)));
}
float map(vec3 p){
  float d = 1e3;
  vec3 q = p; q.xz *= R(uSpin); q.yz *= R(uSpin * .7);
  d = min(d, edge(q, 1.6, .08) + (1. - uW[0]) * 1.2);
  vec3 t = p; t.xy *= R(p.z * uTwist);
  float sq = max(abs(t.x), abs(t.y)), rz = abs(mod(p.z, 1.1) - .55);
  float rib = max(rz - .07, abs(sq - 1.6) - .09);
  vec2 a = abs(t.xy); float rail = min(length(vec2(a.x - 1.6, min(a.y, abs(a.y - 1.6)))), length(vec2(a.y - 1.6, min(a.x, abs(a.x - 1.6))))) - .05;
  float tun = min(rib, rail) + (1. - uW[1]) * .6;
  d = min(d, max(tun, max(1.62 - p.z, p.z - 22.)));
  d = min(d, mix(pillars(p), gyroid(p), uMix) + (1. - uW[3]) * 1.5);
  vec3 o = p - vec3(0., 0., 56.); o.yz *= R(uTime * .9); o.xy *= R(uTime * .55);
  float tor = length(vec2(length(o.xz) - 3., o.y)) - .7;
  float sph = length(o) - 2.3 + .12 * sin(o.x * 3. + uTime) * sin(o.y * 3.) * sin(o.z * 3.);
  d = min(d, mix(tor, sph, uSph) + (1. - uW[4]) * 3.5);
  return d;
}`;

  // 镜头：关键帧 [t, eye, look, roll]，Hermite 插值（按时间缩放切线，速度连续，不刹停）
  const CAM = [
    [0.0, [-4.5, 2.2, -12], [-3.6, 0, 0], -0.12], [1.6, [-1.0, -0.6, -9], [-2.8, 0, 0], 0.1], [3.2, [-2.6, 0.8, -7], [-1.4, 0, 0], -0.06],
    [4.6, [0, 0.1, -3.6], [0, 0, 2], 0], [5.6, [0, 0, -0.6], [0, 0, 6], 0.05],
    [6.6, [0, 0, 3.2], [0, 0, 9], 0.15], [7.5, [0, 0, 6.0], [0, 0, 12], 0.3],
    [8.3, [0, 0, 3.6], [0, 0, 9.6], 0.1], [9.2, [0, 0, 8.2], [0, 0, 14], 0.4],
    [10.2, [0, 0, 11.5], [0, 0, 17.5], 0.2], [11.6, [0, 0.9, 15.5], [0, -0.3, 21.5], 0],
    [13.4, [1.6, 2.4, 20.5], [-0.3, -0.8, 26.5], -0.15], [15.2, [0.4, 0.8, 27], [0.3, 0, 33], -0.05],
    [17.0, [-0.3, 0.3, 33.5], [0, 0, 39.5], 0.25], [18.8, [0, 0, 41], [0, 0, 56], 0],
    // 绕圆环/球做环绕：18.8→28s 转过约 1.3 圈，半径由 9.5 收到 6.5
    ...Array.from({ length: 10 }, (_, k) => {
      const t = 19.8 + k * 0.92, a = -Math.PI / 2 + (t - 18.8) * (0.95 - 0.05 * k), r = 9.5 - 3 * Math.min(1, k / 5);
      return [t, [Math.sin(a) * r * 0.9 + (k < 4 ? 0.3 : 0), 0.35 + 1.2 * Math.sin(t * 0.7), 56 + Math.cos(a) * r], [k < 4 ? -2.6 : 0, 0, 56], 0.08 * Math.sin(t)];
    }),
  ].map(([t, e, l, r]) => [t, [...e, ...l, r]]);
  function camAt(t) {
    const K = CAM, n = K.length;
    if (t <= K[0][0]) return K[0][1];
    if (t >= K[n - 1][0]) return K[n - 1][1];
    let i = 0; while (K[i + 1][0] < t) i++;
    const tan = (k) => k === 0 || k === n - 1 ? K[k][1].map(() => 0) : K[k][1].map((v, c) => (K[k + 1][1][c] - K[k - 1][1][c]) / (K[k + 1][0] - K[k - 1][0]));
    const h = K[i + 1][0] - K[i][0], s = (t - K[i][0]) / h, m0 = tan(i), m1 = tan(i + 1);
    const s2 = s * s, s3 = s2 * s;
    return K[i][1].map((p0, c) => (2 * s3 - 3 * s2 + 1) * p0 + (s3 - 2 * s2 + s) * h * m0[c] + (-2 * s3 + 3 * s2) * K[i + 1][1][c] + (s3 - s2) * h * m1[c]);
  }

  // 贴在世界里的标注：[文本, 世界坐标, 出现, 消失]
  const TAGS = [
    ['mesh.cube( 1.6 )', [1.7, 1.7, -1.7], 0.6, 4.6], ['rotate( t · 40° )', [-1.7, -1.8, 1.7], 1.2, 4.9],
    ['frame 0060', [1.5, 1.3, 7.7], 5.2, 10.4], ['frame 0120', [-1.5, -1.3, 11], 5.6, 10.8],
    ['frame 0180', [1.5, -1.3, 14.3], 6.2, 11.4], ['frame 0240', [-1.5, 1.3, 17.6], 8.6, 12],
    ['node[ 07 ]', [2.2, 0.2, 24.5], 11.2, 14.6], ['node[ 12 ]', [-2.6, 0.6, 27.5], 11.8, 15.4], ['falloff( r )', [1.2, 1.4, 30], 12.6, 16],
    ['gyroid( p )', [1.6, 1.1, 36], 15.4, 17.6], ['sin(p)·cos(p.yzx)', [-1.8, -0.8, 40], 16, 18.4],
    ['torus( 3, .7 )', [3.4, 2.4, 55], 19.4, 21.8], ['→ sphere( 2.3 )', [3.2, -2.6, 55], 21.9, 23.4],
  ];
  const L1 = '*//写 HTML', L2 = '渲染成片+', L3 = '{几何·字符}>';

  await createVideo({
    width: W, height: H, fps: 30,
    theme: { accent: C.g },
    background: null, progress: false, camera: { drift: 0 },
    music: { src: 'assets/bgm.mp3', volume: 0.3, fadeIn: 0.6, fadeOut: 2.4, loop: false },
    chapters: [{
      id: 'take', title: 'Kinema', dur: DUR, rhythm: 'dense',
      html: `
        <p class="kn-t kn-c kn-tl">KINEMA · v0.5</p>
        <p class="kn-t kn-c kn-tr">00.0 / ${DUR.toFixed(1)}</p>
        <p class="kn-t kn-c kn-bl">frame = f(t)</p>
        <p class="kn-t kn-c kn-br">SDF → ASCII · 30FPS</p>
        <p class="kn-t kn-sys">// ---[SCENE_READY]</p>
        <h1 class="kn-t kn-hl"></h1>
        <p class="kn-t kn-read"></p>
        <p class="kn-t kn-cap"></p>
        ${TAGS.map((_, i) => `<p class="kn-t kn-tag" data-i="${i}" style="left:0;top:0;font-weight:700;opacity:0"></p>`).join('')}
        <p class="kn-t kn-l kn-l1"></p>
        <p class="kn-t kn-l kn-l2"></p>
        <p class="kn-t kn-l kn-l3"></p>
        <h2 class="kn-t kn-mark"></h2>
        <p class="kn-t kn-sub">写 HTML，渲染成<em>字符化的三维动画</em></p>
        <p class="kn-t kn-repo">github.com/Slapq/html-motion-kit</p>
        <p class="kn-t kn-note">本片由 Kinema 自身渲染 · Claude Code 编写</p>`,
      build(tl, el) {
        const q = (s) => el.querySelector(s);
        const hl = q('.kn-hl'), cap = q('.kn-cap'), read = q('.kn-read'), tc = q('.kn-tr');
        const l1 = q('.kn-l1'), l2 = q('.kn-l2'), l3 = q('.kn-l3'), mark = q('.kn-mark');
        const sub = q('.kn-sub'), repo = q('.kn-repo'), note = q('.kn-note');
        const tags = [...el.querySelectorAll('.kn-tag')];
        const BIG = [hl, cap, read, l1, l2, l3, mark, sub, repo, note];

        const sp = new AsciiSpace(el, {
          map: MAP, cell: [12, 20], z: 1, fog: 0.055, far: 70,
          uniforms: { uSpin: 0, uTwist: 0, uMix: 0, uSph: 0, uFall: [0, 0] }, arrays: { uW: 5 },
          palette: [C.g, C.b, C.w], accent: C.g2,
        });
        const U = sp.uniforms, uW = sp.arrays.uW;

        // 背景字符尘：空格子里的稀疏符号，按行反向滚动（量化到字符格）
        const DUST = '>>  <<  ::  **  //  ++  ..  ';
        sp.dust = (i, j, t) => {
          const dir = j % 2 ? 1 : -1, off = Math.floor(t * (3 + (j % 4)) * dir);
          const k = i + off, h = hash(k * 7 + j * 131, 5);
          if (h > 0.05) return null;
          const ch = DUST[((k % DUST.length) + DUST.length) % DUST.length];
          if (ch === ' ') return null;
          return [ch, h < 0.035 ? C.bd : C.g, 0.35 + 0.25 * sm(ramp(t, 0, 1.2))];
        };

        // 文字盖住的格子留空：把可见 DOM 文字换算回画布坐标
        const TEXT = [hl, cap, read, l1, l2, l3, mark, sub, repo, note, q('.kn-sys'), ...el.querySelectorAll('.kn-c'), ...tags];
        const maskAt = () => {
          const b = sp.cv.getBoundingClientRect(), k = W / b.width, out = [];
          for (const e of TEXT) {
            if (!e.textContent || parseFloat(getComputedStyle(e).opacity) < 0.15) continue;
            const r = e.getBoundingClientRect(), pad = e.classList.contains('kn-tag') ? 6 : 14;
            out.push({ x: (r.left - b.left) * k - pad, y: (r.top - b.top) * k - pad, w: r.width * k + pad * 2, h: r.height * k + pad * 2 });
          }
          return out;
        };

        // 几何的生长与变形，全部是 t 的纯函数
        // 最后绑定：让遮罩读到本帧已更新的文字位置
        const bindSpace = () => sp.bind(tl, {
          before: (t) => {
            const c = camAt(t);
            sp.cam = { eye: c.slice(0, 3), look: c.slice(3, 6), roll: c[6], focal: 1.5 + 0.25 * sm(ramp(t, 18.5, 23.5)) };
            U.uSpin = t * 1.5 - 0.9 * sm(ramp(t, 3.4, 5)) * (t - 3.4);
            U.uTwist = 0.004 + 0.05 * sm(ramp(t, 5.4, 9.5));
            U.uMix = sm(ramp(t, 14.2, 16.6));
            U.uSph = sm(ramp(t, 21.8, 23.4));
            U.uFall = [2.6 * Math.sin(t * 1.3), c[2] + 5];
            uW[0] = 1 - sm(ramp(t, 6.4, 7));
            uW[1] = sm(ramp(t, 3.6, 5.2)) * (1 - sm(ramp(t, 18.5, 19.5)));
            uW[2] = sm(ramp(t, 9.6, 11.8));
            uW[3] = sm(ramp(t, 9.2, 10.4)) * (1 - sm(ramp(t, 19, 20.5)));
            uW[4] = sm(ramp(t, 16.8, 19.2));
          },
          mask: maskAt,
          reveal: (t) => sm(ramp(t, 0, 0.9)),
        });

        // ---- 文字 ----
        const hlText = document.createElement('i');
        morph(tl, hlText, [[0, ''], [0.3, (t) => type('>( HI )=', t - 0.3, 18)],
          [1.25, '>( HI, MAKER )={<'], [1.95, '>( HI, CODER )={<'], [2.65, '>( HI, AGENT )={<'], [3.35, 'frame = f( t )']], { dur: 0.45, seed: 3 });
        tl.add(() => { const s = hlText.textContent; if (hl.dataset.s !== s) { hl.dataset.s = s; hl.innerHTML = runsHTML(s); } }, { at: 0, label: 'hl:colour' });
        tl.fromTo(q('.kn-sys'), { opacity: 0, x: -24 }, { opacity: 1, x: 0 }, { at: 0.2, dur: 0.4, ease: 'outCubic' });
        tl.to(q('.kn-sys'), { opacity: 0, x: -40 }, { at: 3.0, dur: 0.35, ease: 'inCubic' });
        tl.to(hl, { opacity: 0, x: -160, scale: 1.25 }, { at: 4.25, dur: 0.5, ease: 'inCubic' });

        morph(tl, cap, [[0, ''], [5.0, '画面是时间 t 的函数'], [8.4, '镜头和几何，都跟着 t 走'],
          [11.8, '复制器 · 衰减 · 生长'], [15.1, '几何在变形，字符在流动'], [18.6, '一份 HTML，无头 Chrome 逐帧导出'], [22.6, '']], { dur: 0.5, seed: 7 });
        tl.fromTo(read, { opacity: 0 }, { opacity: 1 }, { at: 5.2, dur: 0.4 });
        tl.to(read, { opacity: 0 }, { at: 22.4, dur: 0.4 });

        morph(tl, l1, [[0, ''], [19.4, (t) => type(L1, t - 19.4, 14)], [23.0, '']], { dur: 0.45, seed: 11 });
        morph(tl, l2, [[0, ''], [20.0, (t) => type(L2, t - 20.0, 12)], [23.1, '']], { dur: 0.45, seed: 13 });
        morph(tl, l3, [[0, ''], [20.6, (t) => type(L3, t - 20.6, 12)], [23.2, '']], { dur: 0.45, seed: 17 });
        for (const [e, dx] of [[l1, 0], [l2, 40], [l3, 80]]) tl.fromTo(e, { x: -60 - dx }, { x: 60 + dx }, { at: 19.4, dur: 4.2, ease: 'linear' });
        morph(tl, mark, [[0, ''], [23.5, '#%@=+*'], [23.9, 'KINEMA']], { dur: 0.6, seed: 19 });
        tl.fromTo(mark, { scale: 1.12 }, { scale: 1 }, { at: 23.5, dur: 1.4, ease: 'outCubic' });
        tl.fromTo(sub, { opacity: 0, y: 18 }, { opacity: 1, y: 0 }, { at: 24.3, dur: 0.6, ease: 'outCubic' });
        tl.fromTo(repo, { opacity: 0, y: 12 }, { opacity: 1, y: 0 }, { at: 24.7, dur: 0.5, ease: 'outCubic' });
        tl.fromTo(note, { opacity: 0 }, { opacity: 1 }, { at: 25.1, dur: 0.5 });
        tl.audio('assets/sfx-click.mp3', 5.55, { volume: 0.45 });
        tl.audio('assets/sfx-click.mp3', 23.9, { volume: 0.5 });

        // 每帧：时间码、读数、世界标注（投影到屏幕，近大远小）
        tl.add((lt, t) => {
          const c = `${t.toFixed(1).padStart(4, '0')} / ${DUR.toFixed(1)}`;
          if (tc.textContent !== c) tc.textContent = c;
          const r = `t = ${t.toFixed(2)}s   frame ${String(Math.round(t * 30)).padStart(4, '0')}   cam.z ${camAt(t)[2].toFixed(1)}`;
          if (read.textContent !== r) read.textContent = r;
          const cm = camAt(t);
          sp.cam = { eye: cm.slice(0, 3), look: cm.slice(3, 6), roll: cm[6], focal: 1.5 + 0.25 * sm(ramp(t, 18.5, 23.5)) };
          TAGS.forEach(([txt, pos, a, b], i) => {
            const e = tags[i], p = t > a - 0.05 && t < b + 0.3 ? sp.project(pos) : null;
            const vis = p && p.depth > 0.8 && p.x > -200 && p.x < W - 60 && p.y > 80 && p.y < H - 110;
            const o = vis ? sm(ramp(t, a, a + 0.3)) * (1 - sm(ramp(t, b, b + 0.3))) * clamp((p.depth - 0.8) / 1.2) : 0;
            e.style.opacity = o.toFixed(3);
            if (o <= 0) return;
            const fs = clamp(p.ppu * 0.2, 18, 64);
            // 整条标注必须留在画内，且不压住大字；贴边时淡出而不是被裁掉
            const tw = [...txt].length * fs * 0.62, edge = Math.min(p.x - 40, W - 40 - (p.x + tw));
            const bx = { l: p.x, r: p.x + tw, t: p.y - fs * 0.6, b: p.y + fs * 0.8 };
            const hitBig = BIG.some((g) => { if (!g.textContent) return false; const r = g.getBoundingClientRect(), k = W / sp.cv.getBoundingClientRect().width;
              const o0 = sp.cv.getBoundingClientRect(); const L = (r.left - o0.left) * k, T = (r.top - o0.top) * k;
              return bx.r > L - 20 && bx.l < L + r.width * k + 20 && bx.b > T - 20 && bx.t < T + r.height * k + 20; });
            if (edge < 0 || hitBig) { e.style.opacity = '0'; return; }
            e.style.opacity = (o * clamp(edge / 60)).toFixed(3);
            e.style.fontSize = fs.toFixed(1) + 'px';
            e.style.left = p.x.toFixed(1) + 'px'; e.style.top = (p.y - fs * 0.6).toFixed(1) + 'px';
            e.style.color = i % 3 === 1 ? C.w : C.g2;
            const s = type(txt, t - a, 28);
            if (e.textContent !== s) e.textContent = s;
          });
        }, { at: 0, label: 'hud' });

        bindSpace();
      },
    }],
  });
</script>
