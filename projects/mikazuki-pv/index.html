    /* 三日月ステップ（r-906 feat. 初音ミク）PV v2
       解读：君 = 还没出名的"三日月"偶像，僕 = 单恋的粉丝。朱色黄昏里只有僕在楼缝间看见她 → 副歌里僕踩着楼顶一级级往月亮爬 →
       爆料把她关进笼子、标价出售 → 愤怒与"粗末なアイロニー" → 明知"不是我的"仍然伸出手，差一点点。
       这一支片子的原则：
       1. 只用几何。月牙（圆减圆）= 君，一个小点 = 僕。故事只靠位置、距离、遮挡讲。
       2. 一句歌词 = 一个镜头。句内缓慢滑动（蓄势）；换句时冲刺：前几帧慢，最后两三帧跳到下一个构图，带真实拖影（快门内多次采样平均），落定后清晰。
       3. 镜头长度差 4 倍以上：主歌长、副歌中、爆发段短，间奏越切越快；安静段死死定住。
       4. 每个交界都有东西活下来：月牙一直在；僕走过的那条线（爬楼、坠落、奔跑）把镜头串起来。
       5. 不闪、不抖。只有真正"打到"的地方震一下：虫唾が走る、127.9 的闪白、でも嫌なんだ!
       6. 城市是一组固定的楼，不回收、不凭空长出来；楼顶就是台阶。
       7. カゴの中 = 雨变成竖线冲下来切开月牙；売られてた = 竖线排成条码，月牙被框进矩形。只用直线和矩形。 */
    .stage, .film { background: #000; }
    .mk-cv { position: absolute; left: 0; top: 0; }

<script type="module">
  import { createVideo } from '../../engine/index.js';

  const DUR = 186.8, W = 1920, H = 1080, BEAT = 60 / 167, SHUT = 1 / 60;
  const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
  const ramp = (t, a, b) => clamp((t - a) / (b - a));
  const sm = (x) => x * x * (3 - 2 * x);
  const oc = (x) => 1 - Math.pow(1 - x, 3);

  const hash = (i, s = 0) => { const x = Math.sin(i * 127.1 + s * 311.7) * 43758.5453; return x - Math.floor(x); };
  const win = (t, a, b, f = 0.3) => sm(ramp(t, a - f, a)) * (1 - sm(ramp(t, b, b + f)));

  const dashD = (len) => clamp(len * 0.22, 0.12, 0.3);
  function track(shots, end) {
    const S = shots.map(([t0, a, b], i) => ({ t0, a, b: b || a, t1: shots[i + 1] ? shots[i + 1][0] : end }));

    const slide = (s, t) => { const span = s.t1 - s.d - s.t0, u = clamp((t - s.t0) / Math.max(1e-3, span)); return s.a.map((v, c) => lerp(v, s.b[c], u)); };
    return (t) => {
      let i = 0; while (i < S.length - 1 && S[i + 1].t0 <= t) i++;
      const s = S[i];
      if (t < s.t0) return s.a.slice();
      if (!S[i + 1] || t < s.t1 - s.d) return slide(s, t);
      const from = s.b, to = S[i + 1].a, u = Math.pow(ramp(t, s.t1 - s.d, s.t1), 4);
      return from.map((v, c) => lerp(v, to[c], u));

  const PERCH = { layer: 0, x0: 560, x1: 800, h: 240, z0: RZ, z1: RZ + RD, win: [] };

  function onStairs(S, t) {
    const k = Math.max(0, (t - S.t0) / S.per), kc = Math.floor(k), f = k - kc;
    const a = stepTop(S, kc), b = stepTop(S, kc + 1), u = clamp(f / 0.5);
    return [lerp(a[0], b[0], sm(u)), lerp(a[1], b[1], u) + Math.sin(Math.PI * u) * 70, FZ];

    const ws = cs.map((c) => g.measureText(c).width), tw = ws.reduce((p, q) => p + q, 0);
    let x = (align > 0 ? 140 : W - 140 - tw) + dx;
    const acc = accentMask(L.s), span = Math.min(BEAT * 4, (L.end - L.t0) * 0.5);
    const bar = oc(ramp(t, L.t0 - 0.05, L.t0 + 0.35));
    g.fillStyle = rgb(pal.acc, 0.9 * a); const bw = (tw + 60) * bar; g.fillRect(align > 0 ? x - 30 : x + tw + 30 - bw, y + fs * 0.12, bw, fs * 0.1);
    cs.forEach((c, i) => {
      const k = charK(t, L.t0, i, n, span);
      if (k > 0) {
        const b = ob(k);
        g.globalAlpha = clamp(k * 3) * a;
        g.save(); g.translate(x + ws[i] / 2, y + (1 - b) * fs * 0.5);
        g.lineWidth = fs * 0.14; g.lineJoin = 'round'; g.strokeStyle = rgb(mixc(pal.top, [0, 0, 0], 0.4), 0.85); g.strokeText(c, 0, 0);
        g.fillStyle = acc[i] ? rgb(pal.acc) : rgb(pal.txt); g.fillText(c, 0, 0); g.restore();
      }
      x += ws[i];
    });
    g.restore();
  }
  // 爆发段：一句一屏砸进来（放大 → 落定），锚点轮换；不抖、不色散
  const XPOS = [[960, 300, 0], [760, 820, -0.05], [1160, 560, 0.04], [960, 760, 0], [700, 380, 0.04], [1240, 720, -0.04]];
  function lyricX(g, pal, L, t) {
    const cs = [...L.s], n = cs.length, [px, py, rot] = XPOS[L.i % XPOS.length];
    const fs = Math.min(180, 1500 / n), age = t - L.t0, slam = oc(clamp(age / 0.12));
    const [dx, a] = leave(L, t, L.i % 2 ? 1 : -1), sc = lerp(1.6, 1, slam) * (1 + 0.015 * age);
    g.save(); g.font = `900 ${fs}px ${JP}`;
    const ws = cs.map((c) => g.measureText(c).width), tw = ws.reduce((p, q) => p + q, 0);
    const half = (tw / 2 + 40) * sc, cx = clamp(px, Math.min(960, half + 40), Math.max(960, W - half - 40));
    g.translate(cx + dx, py); g.rotate(rot); g.scale(sc, sc);
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.globalAlpha = clamp(age / 0.04) * a;
    g.fillStyle = 'rgba(10,0,4,.8)'; g.fillRect(-tw / 2 - 30, -fs * 0.62, (tw + 60) * oc(clamp(age / 0.1)), fs * 1.24);
    const acc = accentMask(L.s); let x = -tw / 2;
    cs.forEach((c, i) => { g.fillStyle = acc[i] ? rgb(pal.acc) : '#fff'; g.fillText(c, x + ws[i] / 2, 0); x += ws[i]; });
    g.restore();
  }
  function lyricQ(g, pal, L, t) {
    const k = win(t, L.t0 + 0.2, L.end - 0.3, 0.6);
    if (k <= 0) return;
    g.save(); g.globalAlpha = k; g.font = `500 34px ${SERIF}`; g.textAlign = 'center'; g.fillStyle = rgb(pal.txt);
    g.fillText(L.s, 960, 900); g.restore();
  }
  function lyrics(g, pal, v, t) {
    for (const L of LINES) {
      if (t < L.t0 || t > L.end) continue;
      if (L.m === 'v') lyricV(g, pal, L, t, v);
      else if (L.m === 'h') lyricH(g, pal, L, t);
      else if (L.m === 'x') lyricX(g, pal, L, t);
      else lyricQ(g, pal, L, t);
    }
  }
  function credits(g, t) {
    for (const [a, b, s] of CREDITS) {
      const k = win(t, a + 0.35, b - 0.35, 0.35);
      if (k <= 0) continue;
      g.save(); g.globalAlpha = k * clamp(whiteK(t)); g.font = `400 26px ${SERIF}`; g.textAlign = 'center'; g.fillStyle = '#8a8a8a';
      g.fillText(s, 960, 690); g.restore();
    }
  }

  // ---- 一帧 ----
  function scene(g, t) {
    const pal = palAt(t), v = shotAt(t), c = camOf(v), [sx, sy] = shakeAt(t), wk = clamp(whiteK(t));
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
    g.translate(W / 2 + sx, H / 2 + sy); g.rotate(c.roll); g.translate(-W / 2, -H / 2);
    sky(g, pal, c);
    stars(g, pal, v);
    moon(g, pal, v, t, sliceAt(t));
    echoes(g, pal, v, t);
    city(g, pal, c, t);
    boku(g, pal, c, t);
    cage(g, pal, v, t);
    g.setTransform(1, 0, 0, 1, 0, 0);
    lyrics(g, pal, v, t);
    if (wk > 0) {
      g.fillStyle = `rgba(250,250,248,${wk})`; g.fillRect(0, 0, W, H);
      rings(g, t); credits(g, t);
      const ma = moonA(t);
      if (ma > 0) { g.globalAlpha = ma * wk; moon(g, WHITE, v, t); g.globalAlpha = 1; }
    }
    const fl = t >= 127.9 ? Math.exp(-(t - 127.9) * 5) : 0;
    if (fl > 0.004) { g.fillStyle = `rgba(255,255,255,${fl})`; g.fillRect(0, 0, W, H); }
    const vg = g.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, H * 1.05);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, `rgba(0,0,0,${0.45 * (1 - wk)})`);
    g.fillStyle = vg; g.fillRect(0, 0, W, H);
  }
  // 画面里最快的东西这一帧走了多少像素（镜头、月、僕）
  function speed(t) {
    const a = shotAt(t), b = shotAt(t - SHUT), p = bokuAt(t), pa = proj(p[0], p[1], p[2], camOf(a)), pb = proj(p[0], p[1], p[2], camOf(b));
    let d = Math.max(Math.hypot(a[6] - b[6], a[7] - b[7]) + Math.abs(a[8] - b[8]), Math.abs(a[5] - b[5]), Math.abs(a[4] - b[4]) * 1000);
    if (pa && pb) d = Math.max(d, Math.hypot(pa[0] - pb[0], pa[1] - pb[1]));
    return d;
  }
  // 运动模糊：快门 1/60s 内多次采样取平均；静止或慢滑时只画一次，保持清晰
  const sc = Object.assign(document.createElement('canvas'), { width: W, height: H }), sg = sc.getContext('2d');
  function frame(g, t) {
    const d = speed(t), n = d < 4 ? 1 : Math.min(24, Math.ceil(d / 6) + 1);
    if (n === 1) { scene(g, t); return; }
    for (let i = 0; i < n; i++) {
      scene(sg, t - (SHUT * i) / (n - 1));
      g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1 / (i + 1); g.drawImage(sc, 0, 0);
    }
    g.globalAlpha = 1;
  }

  await createVideo({
    width: W, height: H, fps: 30,
    background: null, progress: false, camera: { drift: 0 },
    music: { src: 'assets/song.mp3', volume: 1, fadeIn: 0, fadeOut: 0, loop: false },
    chapters: [{
      id: 'mikazuki', title: '三日月ステップ', dur: DUR, rhythm: 'dense',
      html: `<canvas class="mk-cv" width="${W}" height="${H}"></canvas>`,
      build(tl, el) {
        const g = el.querySelector('.mk-cv').getContext('2d');
        tl.add((lt, t) => frame(g, t), { at: 0, label: 'pv' });
      },
    }],
  });
</script>
</body>
</html>
